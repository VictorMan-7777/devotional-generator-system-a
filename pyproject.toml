[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devotional-generator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3",
    "fastapi>=0.100",
    "sqlalchemy>=2.0",
    "httpx>=0.24",
    "anthropic>=0.84",
    "Pillow>=10.0",
    "requests>=2.28",
    "img2pdf>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "pytest-asyncio>=0.21",
]
codex = [
    "openai>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
